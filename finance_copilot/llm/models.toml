# Catálogo de modelos do Finance Copilot.
#
# É a ÚNICA lista de modelos aceita com LLM_FREE_ONLY=true: um modelo fora daqui, ou com
# cost = "paid" ou "unknown", é bloqueado. Nada é deduzido do nome do provedor.
#
# cost:      free  = gratuito na camada free do provedor, conforme a documentação em checked_on
#            local = roda na sua máquina (Ollama), sem cobrança por token
#            paid  = cobra por token
# "free" NÃO é uma garantia permanente: preços, limites e modelos mudam. Confira o provedor antes
# de usar e veja docs/LLM_PROVIDERS.md. O app não controla o faturamento da sua conta externa.
#
# tool_calling:        o agente só funciona com true.
# parallel_tool_calls: o modelo pode pedir várias ferramentas na mesma resposta. Com false, o
#                      agente ainda funciona, chamando uma ferramenta por vez (mais chamadas).
# structured_output:   método do "Preencher com IA": function_calling | json_schema | json_mode |
#                      default (padrão da integração) | none (desativa o recurso).
# options:             argumentos extras do cliente LangChain, por modelo.
# tested:              "mock" = testado só com servidor simulado; "live" = validado com a API real.

# --- Groq (camada gratuita do GroqCloud) ------------------------------------------------------
# Fonte: console.groq.com/docs/tool-use, /structured-outputs e /rate-limits.
# Llama 3.x, qwen3-32b e kimi-k2 foram desativados para contas free/developer em 2026.

[[models]]
provider = "groq"
model = "openai/gpt-oss-120b"
label = "GPT-OSS 120B"
cost = "free"
recommended = true
tool_calling = true
parallel_tool_calls = false
structured_output = "function_calling"
checked_on = 2026-11-03
tested = "live"  # scripts/smoke_llm.py: 5/5 passos em 03/11/2026
notes = "Free: 30 req/min, 1.000 req/dia, 8K tokens/min, 200K tokens/dia. Cada turno com ferramenta usa ~7K tokens: espere ~1 pergunta por minuto."

[[models]]
provider = "groq"
model = "openai/gpt-oss-20b"
label = "GPT-OSS 20B"
cost = "free"
tool_calling = true
parallel_tool_calls = false
structured_output = "function_calling"
checked_on = 2026-11-03
tested = "mock"
notes = "Mais rápido e menos preciso que o 120B. Mesmos limites gratuitos."

